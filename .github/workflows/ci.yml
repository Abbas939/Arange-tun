name: Validate fork
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install full Packet build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev gcc
      - name: Formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Build the full Linux binary
        run: CGO_ENABLED=1 go build -trimpath -o arange-tun .
      - name: Install checksum-pinned Xray for real helper traffic tests
        run: python3 tools/install-helper.py xray --destination "$RUNNER_TEMP/helpers"
      - name: Full test suite including real helper traffic
        # Existing management tests write /etc/arange-tun; use an isolated CI VM.
        run: sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOPATH=$(go env GOPATH)" "ARANGE_XRAY_BINARY=$RUNNER_TEMP/helpers/xray" go test ./... -timeout 20m
      - name: Race checks on changed networking packages
        run: go test -race ./internal/ssh ./internal/socksproxy ./internal/tunnel/... ./internal/frp ./internal/rathole ./internal/safearchive -timeout 10m
      - name: Vet
        run: go vet ./...
      - name: Known vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 .
