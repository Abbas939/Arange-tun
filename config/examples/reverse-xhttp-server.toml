# Reverse: server runs on Iran, client runs abroad.
[server]
bind_addr = "127.0.0.1:19090"
transport = "tcp"
token = "REPLACE_WITH_THE_SAME_RANDOM_64_CHARACTER_TOKEN_ON_BOTH_SERVERS"
ports = ["127.0.0.1:8080=127.0.0.1:80"]

[server.xray]
binary = "/usr/local/lib/arange-tun/xray"
mode = "xhttp"
listen = "0.0.0.0:443"
uuid = "REPLACE_WITH_THE_SAME_RANDOM_UUID"
server_name = "tunnel.example.com"
path = "/REPLACE_WITH_RANDOM_PRIVATE_PATH"
certificate = "/etc/arange-tun/tunnel.crt"
key = "/etc/arange-tun/tunnel.key"
